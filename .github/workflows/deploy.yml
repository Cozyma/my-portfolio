name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}

jobs:
  ###################################
  # Job 1: フロントエンド (React) のデプロイ
  ###################################
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build React App
        working-directory: frontend
        run: yarn build
        env:
          # GitHub リポジトリ変数 vars.API_BASE_URL を Vite の環境変数へ注入
          VITE_API_BASE_URL: ${{ env.API_BASE_URL || vars.API_BASE_URL }}
          # サイトのベースURL（例: https://example.com）
          SITE_BASE_URL: ${{ env.SITE_BASE_URL || vars.SITE_BASE_URL }}

      - name: Deploy to S3 (SSG client artifacts)
        run: aws s3 sync frontend/dist/client s3://$S3_BUCKET --delete

      - name: Invalidate CloudFront Cache
        if: ${{ env.CF_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id $CF_DISTRIBUTION_ID --paths "/*"

  ###################################
  # Job 2: バックエンド (Laravel/Bref) のデプロイ
  ###################################
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, mbstring, zip, pdo, pdo_mysql, bcmath
          tools: composer
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js (for Serverless CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Serverless CLI
        run: npm install -g serverless

      - name: Ensure bootstrap/cache exists and writable
        working-directory: backend/laravel
        run: |
          mkdir -p bootstrap/cache
          chmod -R 777 bootstrap/cache

      - name: Install Composer dependencies
        working-directory: backend/laravel
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy with Serverless (Bref)
        working-directory: backend/laravel
        run: serverless deploy --stage prod --region $AWS_REGION
