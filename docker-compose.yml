services:
  frontend:
    image: node:18-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "yarn install && yarn dev --host 0.0.0.0 --port 5173"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app
    volumes:
      - ./backend/laravel:/app
    command: >-
      bash -lc 'if [ -f artisan ]; then
        mkdir -p storage/framework/{cache,views,sessions} && \
        chown -R www-data:www-data storage bootstrap/cache && \
        find storage -type d -exec chmod 775 {} + && \
        find storage -type f -exec chmod 664 {} + && \
        chmod -R 775 bootstrap/cache && \
        php-fpm -F;
      else
        echo "[backend] Laravel not initialized. Run: docker compose run --rm backend composer create-project laravel/laravel .";
        sleep infinity;
      fi'

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/laravel:/app:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
